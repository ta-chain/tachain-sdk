        无流水号时用 OrderNumber + OrderDate + SupplierName/SupplierCode；LineNumber 可选，不传则返回整单各明细待办。
        支持查询返回的 OrderId/OrderLineId；所有已提供条件取交集。
        复用 GetOrderLineHasPendingAsync 对应 Service，逐行返回现有收货待办及已本地化消息。
