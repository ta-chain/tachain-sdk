openapi: 3.0.1
info:
  description: Public integration endpoints. Set your own base URL and credential
    before calling.
  title: Tactic Chain Public API
  version: 1.0.0
servers:
- description: Replace with your Tactic Chain API base URL
  url: https://api.example.com
paths:
  /v1/declaration/Delete:
    delete:
      deprecated: false
      description: |-
        删除只会软删除申报资料记录，不会删除订单、生产单、发货单，也不会触发快速申报。
        删除后会按受影响的 `StageId + ExtendId` 重新计算申报完成度。
      operationId: deleteV1DeclarationDelete
      parameters:
      - description: 查询返回的附件申报记录标识；也可在 Body 按单据和资料类型删除。
        explode: true
        in: query
        name: attachmentId
        required: false
        schema:
          type: string
        style: form
      - description: 查询返回的表单记录标识；也可在 Body 按业务键删除。
        explode: true
        in: query
        name: formDataId
        required: false
        schema:
          type: string
        style: form
      - description: "Use 'Token' with bearer authorization, or 'API Key' with signed\
          \ API key headers. This header is mandatory in the deployed API."
        explode: false
        in: header
        name: X-Credential-Type
        required: true
        schema:
          enum:
          - Token
          - API Key
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            example:
              stageId: Order
              orderSide: SO
              supplierExtNo: ERP-SO-001-10
              customerName: 客户名称
              documentTypeCode: INVOICE
              deleteAttachments: true
              deleteForms: false
            schema:
              $ref: "#/components/schemas/TacticChainApiServiceControllersApiIntegrationV1ApiDeclarationDeleteRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/deleteV1DeclarationDelete_200_response"
          description: 检查响应体 Code；业务成功与业务校验失败均可能使用 HTTP 200。
          x-apifox-name: ""
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TacticChainApiServiceControllersApiIntegrationV1ApiErrorResponse"
          description: 请求包含不支持的字段、类型错误或无法解析的内容；返回 code、data、message。
          x-apifox-name: ""
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TacticChainApiServiceControllersApiIntegrationV1ApiErrorResponse"
          description: 凭证无效。
          x-apifox-name: ""
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TacticChainApiServiceControllersApiIntegrationV1ApiErrorResponse"
          description: 凭证无接口权限。
          x-apifox-name: ""
      security:
      - BearerToken: []
      - ApiKey: []
        Timestamp: []
        Signature: []
      summary: 申报信息删除接口。
      tags:
      - ApiDeclaration
      x-apifox-folder: SwaggerApi/ApiDeclaration
      x-apifox-status: released
      x-run-in-apifox: https://apifox.com/web/project/6135400/apis/api-491184339-run
      x-content-type: application/json
      x-accepts:
      - application/json
  /v1/declaration/ListPaging:
    get:
      deprecated: false
      description: |-
        附件申报和表单申报分别分页查询后放在同一个响应中返回。
        建议调用方尽量传入 `extendId` 和 `stageId`，以便精确查询某个业务单据的申报资料。
      operationId: getV1DeclarationListPaging
      parameters:
      - description: 关键词搜索，具体匹配范围见本接口说明。
        explode: true
        in: query
        name: searchText
        required: false
        schema:
          type: string
        style: form
      - description: 查询返回的业务单据 ID，可选；使用业务组合时无需传入。
        explode: true
        in: query
        name: extendId
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: 阶段业务代码：Order、Production、Receipt、Deliverynote。它不是需要猜测的数据库数字 ID。
        explode: true
        in: query
        name: stageId
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: RequiredDocuments 返回的资料类型标识，可选；也可用 documentTypeCode。
        explode: true
        in: query
        name: documentTypeId
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: 资料类型业务代码或当前公司启用的外部映射。
        explode: true
        in: query
        name: documentTypeCode
        required: false
        schema:
          type: string
        style: form
      - description: 通用业务单号：订单阶段为订单号，生产/入库阶段为生产编号，发货阶段为发货单号。
        explode: true
        in: query
        name: extendNumber
        required: false
        schema:
          type: string
        style: form
      - description: 订单日期 yyyy-MM-dd，业务定位按当天范围匹配。
        explode: true
        in: query
        name: orderDate
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: 订单行号。流水号可以替代它；需要按行操作时最终必须唯一匹配。
        explode: true
        in: query
        name: lineNumber
        required: false
        schema:
          type: string
        style: form
      - description: PO=当前公司为采购方；SO=当前公司为销售方。申报可不传，出现两侧匹配歧义时补充。
        explode: true
        in: query
        name: orderSide
        required: false
        schema:
          type: string
        style: form
      - description: 当前公司成品编码、名称或 Product/Material 外部映射值（列表以实际筛选字段为准）。
        explode: true
        in: query
        name: productCode
        required: false
        schema:
          type: string
        style: form
      - description: 可选类型校验，Production 阶段默认 0、Receipt 阶段默认 1；不作为生产编号唯一性的组成部分。
        explode: true
        in: query
        name: productionType
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: 发货单号，配合交易双方定位；发货阶段优先于 extendNumber。
        explode: true
        in: query
        name: deliveryNumber
        required: false
        schema:
          type: string
        style: form
      - description: 查询状态过滤，不作为写入状态字段开放。
        explode: true
        in: query
        name: status
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: 可选业务筛选条件；与其他条件同时生效。
        explode: true
        in: query
        name: riskWarning
        required: false
        schema:
          items:
            format: int32
            type: integer
          type: array
        style: form
      - description: 排序表达式；使用服务支持的字段，格式示例 CreatedAt:desc。
        explode: true
        in: query
        name: sortBy
        required: false
        schema:
          type: string
        style: form
      - description: 页码，默认 1；小于等于 0 时调整为 1。
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          format: int32
          type: integer
        style: form
      - description: 每页条数，默认 10（参考数据默认 50）；不在 1～100 范围时使用 10。
        explode: true
        in: query
        name: pageSize
        required: false
        schema:
          default: 10
          format: int32
          type: integer
        style: form
      - description: 买方外部系统的订单明细流水号；重复时补充交易对方/订单条件。
        explode: true
        in: query
        name: CustomerExtNo
        required: false
        schema:
          type: string
        style: form
      - description: 卖方外部系统的订单明细流水号；重复时补充交易对方/订单条件。
        explode: true
        in: query
        name: SupplierExtNo
        required: false
        schema:
          type: string
        style: form
      - description: 系统生成的订单明细全局流水号，查询返回后可直接使用；不可自行生成。
        explode: true
        in: query
        name: UniqueNo
        required: false
        schema:
          type: string
        style: form
      - description: 查询返回的客户公司 ID，可选；可使用 CustomerName/CustomerCode。
        explode: true
        in: query
        name: CustomerId
        required: false
        schema:
          type: string
        style: form
      - description: 客户英文名、当地语言名称或简称，精确匹配。
        explode: true
        in: query
        name: CustomerName
        required: false
        schema:
          type: string
        style: form
      - description: 客户业务编码、名称或当前公司启用的 Customer/Company 外部映射值。
        explode: true
        in: query
        name: CustomerCode
        required: false
        schema:
          type: string
        style: form
      - description: 查询返回的供应商公司 ID，可选；可使用 SupplierName/SupplierCode。
        explode: true
        in: query
        name: SupplierId
        required: false
        schema:
          type: string
        style: form
      - description: 供应商英文名、当地语言名称或简称，精确匹配。
        explode: true
        in: query
        name: SupplierName
        required: false
        schema:
          type: string
        style: form
      - description: 供应商业务编码、名称或当前公司启用的 Supplier/Company 外部映射值。
        explode: true
        in: query
        name: SupplierCode
        required: false
        schema:
          type: string
        style: form
      - description: 入库单号；用于核对具体入库记录，发生多次入库歧义时补充。
        explode: true
        in: query
        name: receiptNumber
        required: false
        schema:
          type: string
        style: form
      - description: "Use 'Token' with bearer authorization, or 'API Key' with signed\
          \ API key headers. This header is mandatory in the deployed API."
        explode: false
        in: header
        name: X-Credential-Type
        required: true
        schema:
          enum:
          - Token
          - API Key
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getV1DeclarationListPaging_200_response"
          description: 检查响应体 Code；业务成功与业务校验失败均可能使用 HTTP 200。
          x-apifox-name: ""
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TacticChainApiServiceControllersApiIntegrationV1ApiErrorResponse"
          description: 请求包含不支持的字段、类型错误或无法解析的内容；返回 code、data、message。
          x-apifox-name: ""
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TacticChainApiServiceControllersApiIntegrationV1ApiErrorResponse"
          description: 凭证无效。
          x-apifox-name: ""
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TacticChainApiServiceControllersApiIntegrationV1ApiErrorResponse"
          description: 凭证无接口权限。
          x-apifox-name: ""
      security:
      - BearerToken: []
      - ApiKey: []
        Timestamp: []
        Signature: []
      summary: 申报信息查询接口。
      tags:
      - ApiDeclaration
      x-apifox-folder: SwaggerApi/ApiDeclaration
      x-apifox-status: released
      x-run-in-apifox: https://apifox.com/web/project/6135400/apis/api-491184338-run
      x-accepts:
      - application/json
  /v1/declaration/RequiredDocuments:
    get:
      deprecated: false
      description: |-
        该接口只接收能够唯一定位已存在单据的字段。订单、生产、发货等链路参数由接口内部从系统数据反查，
        不再要求外部传供应商、客户、产品、国家、订单行、领料明细等规则参数。
        订单支持 UniqueNo（查询返回的系统流水号）、CustomerExtNo（买方 ERP 流水号）、SupplierExtNo（卖方 ERP 流水号）。
        外部流水号重复时补交易对方 Name/Code、订单号、日期或行号；多个条件取交集，无唯一匹配则报错。
        无流水号时使用订单号 + 日期 + 交易对方；发货按发货方 + 收货方 + 单号，生产按当前公司 + 编号 + 成品。
        调用方应先调用本接口取得 `DocumentTypeId`、是否必填、表单结构等信息，再调用提交接口保存附件或表单数据。
      operationId: getV1DeclarationRequiredDocuments
      parameters:
      - description: 阶段业务代码：Order、Production、Receipt、Deliverynote；支持已维护的可见枚举或外部映射。
        explode: true
        in: query
        name: stageCode
        required: true
        schema:
          type: string
        style: form
      - description: 查询返回的单据 ID，可选；优先使用本文业务组合。
        explode: true
        in: query
        name: id
        required: false
        schema:
          type: string
        style: form
      - description: 订单号。定位操作使用精确匹配；列表接口作为筛选条件。
        explode: true
        in: query
        name: orderNumber
        required: false
        schema:
          type: string
        style: form
      - description: 订单日期 yyyy-MM-dd，业务定位按当天范围匹配。
        explode: true
        in: query
        name: orderDate
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: PO=当前公司为采购方；SO=当前公司为销售方。申报可不传，出现两侧匹配歧义时补充。
        explode: true
        in: query
        name: orderSide
        required: false
        schema:
          type: string
        style: form
      - description: 生产编号，与 productCode 联合定位；多次入库时补充 receiptNumber。
        explode: true
        in: query
        name: productionNumber
        required: false
        schema:
          type: string
        style: form
      - description: 当前公司成品编码、名称或 Product/Material 外部映射值（列表以实际筛选字段为准）。
        explode: true
        in: query
        name: productCode
        required: false
        schema:
          type: string
        style: form
      - description: 可选类型校验，Production 阶段默认 0、Receipt 阶段默认 1；不作为生产编号唯一性的组成部分。
        explode: true
        in: query
        name: productionType
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: 发货单号，配合交易双方定位；发货阶段优先于 extendNumber。
        explode: true
        in: query
        name: deliveryNumber
        required: false
        schema:
          type: string
        style: form
      - description: 买方外部系统的订单明细流水号；重复时补充交易对方/订单条件。
        explode: true
        in: query
        name: CustomerExtNo
        required: false
        schema:
          type: string
        style: form
      - description: 卖方外部系统的订单明细流水号；重复时补充交易对方/订单条件。
        explode: true
        in: query
        name: SupplierExtNo
        required: false
        schema:
          type: string
        style: form
      - description: 系统生成的订单明细全局流水号，查询返回后可直接使用；不可自行生成。
        explode: true
        in: query
        name: UniqueNo
        required: false
        schema:
          type: string
        style: form
      - description: 查询返回的客户公司 ID，可选；可使用 CustomerName/CustomerCode。
        explode: true
        in: query
        name: CustomerId
        required: false
        schema:
          type: string
        style: form
      - description: 客户英文名、当地语言名称或简称，精确匹配。
        explode: true
        in: query
        name: CustomerName
        required: false
        schema:
          type: string
        style: form
      - description: 客户业务编码、名称或当前公司启用的 Customer/Company 外部映射值。
        explode: true
        in: query
        name: CustomerCode
        required: false
        schema:
          type: string
        style: form
      - description: 查询返回的供应商公司 ID，可选；可使用 SupplierName/SupplierCode。
        explode: true
        in: query
        name: SupplierId
        required: false
        schema:
          type: string
        style: form
      - description: 供应商英文名、当地语言名称或简称，精确匹配。
        explode: true
        in: query
        name: SupplierName
        required: false
        schema:
          type: string
        style: form
      - description: 供应商业务编码、名称或当前公司启用的 Supplier/Company 外部映射值。
        explode: true
        in: query
        name: SupplierCode
        required: false
        schema:
          type: string
        style: form
      - description: 入库单号；用于核对具体入库记录，发生多次入库歧义时补充。
        explode: true
        in: query
        name: receiptNumber
        required: false
        schema:
          type: string
        style: form
      - description: 订单行号。流水号可以替代它；需要按行操作时最终必须唯一匹配。
        explode: true
        in: query
        name: lineNumber
        required: false
        schema:
          type: string
        style: form
      - description: "Use 'Token' with bearer authorization, or 'API Key' with signed\
          \ API key headers. This header is mandatory in the deployed API."
        explode: false
        in: header
        name: X-Credential-Type
        required: true
        schema:
          enum:
          - Token
          - API Key
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getV1DeclarationRequiredDocuments_200_response"
          description: 检查响应体 Code；业务成功与业务校验失败均可能使用 HTTP 200。
          x-apifox-name: ""
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TacticChainApiServiceControllersApiIntegrationV1ApiErrorResponse"
          description: 请求包含不支持的字段、类型错误或无法解析的内容；返回 code、data、message。
          x-apifox-name: ""
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TacticChainApiServiceControllersApiIntegrationV1ApiErrorResponse"
          description: 凭证无效。
          x-apifox-name: ""
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TacticChainApiServiceControllersApiIntegrationV1ApiErrorResponse"
          description: 凭证无接口权限。
          x-apifox-name: ""
      security:
      - BearerToken: []
      - ApiKey: []
        Timestamp: []
        Signature: []
      summary: 单据所需申报信息查询接口。
      tags:
      - ApiDeclaration
      x-apifox-folder: SwaggerApi/ApiDeclaration
      x-apifox-status: released
      x-run-in-apifox: https://apifox.com/web/project/6135400/apis/api-491184336-run
      x-accepts:
      - application/json
  /v1/declaration/Submit:
    post:
      deprecated: false
      description: |2-

        先调用 RequiredDocuments 查询所需资料，将返回的 data[].code 填入 DocumentList[].DocumentTypeCode。
                    附件先调用 UploadFile，再将返回的 data.fileId 填入 DocumentList[].FileList[].FileId。
                    ExtendId 表示订单、生产单或发货单等业务 ID，StageId 对应查询时的 stageCode。

        表单按 RequiredDocuments 的 schemaDefinition 填写 value，再将完整数组序列化为 FormData 字符串。
                    保存后可用 ListPaging 复查；返回的 attachments[].id 用于删除附件申报，forms[].id 用于修改或删除表单。
      operationId: postV1DeclarationSubmit
      parameters:
      - description: "Use 'Token' with bearer authorization, or 'API Key' with signed\
          \ API key headers. This header is mandatory in the deployed API."
        explode: false
        in: header
        name: X-Credential-Type
        required: true
        schema:
          enum:
          - Token
          - API Key
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            example:
              stageId: Order
              orderSide: SO
              uniqueNo: 查询返回的系统流水号
              documentList:
              - documentTypeCode: INVOICE
                fileList:
                - fileId: UploadFile返回的FileId
            schema:
              $ref: "#/components/schemas/TacticChainApiServiceControllersApiIntegrationV1ApiDeclarationSubmitRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/postV1DeclarationSubmit_200_response"
          description: 检查响应体 Code；业务成功与业务校验失败均可能使用 HTTP 200。
          x-apifox-name: ""
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TacticChainApiServiceControllersApiIntegrationV1ApiErrorResponse"
          description: 请求包含不支持的字段、类型错误或无法解析的内容；返回 code、data、message。
          x-apifox-name: ""
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TacticChainApiServiceControllersApiIntegrationV1ApiErrorResponse"
          description: 凭证无效。
          x-apifox-name: ""
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TacticChainApiServiceControllersApiIntegrationV1ApiErrorResponse"
          description: 凭证无接口权限。
          x-apifox-name: ""
      security:
      - BearerToken: []
      - ApiKey: []
        Timestamp: []
        Signature: []
      summary: 申报文件/表单提交接口。
      tags:
      - ApiDeclaration
      x-apifox-folder: SwaggerApi/ApiDeclaration
      x-apifox-status: released
      x-run-in-apifox: https://apifox.com/web/project/6135400/apis/api-491184337-run
      x-content-type: application/json
      x-accepts:
